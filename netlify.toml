[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"
  directory = "netlify/functions"

# Tenant-scoped API
[[redirects]]
  from = "/api/:tenant/public-config"
  to = "/.netlify/functions/public-config?tenant=:tenant"
  status = 200
  force = true
[[redirects]]
  from = "/api/:tenant/submit"
  to = "/.netlify/functions/submit?tenant=:tenant"
  status = 200
  force = true
[[redirects]]
  from = "/api/:tenant/admin-login"
  to = "/.netlify/functions/admin-login?tenant=:tenant"
  status = 200
  force = true
[[redirects]]
  from = "/api/:tenant/admin-logout"
  to = "/.netlify/functions/admin-logout?tenant=:tenant"
  status = 200
  force = true
[[redirects]]
  from = "/api/:tenant/admin-session"
  to = "/.netlify/functions/admin-session?tenant=:tenant"
  status = 200
  force = true
[[redirects]]
  from = "/api/:tenant/sites"
  to = "/.netlify/functions/sites?tenant=:tenant"
  status = 200
  force = true
[[redirects]]
  from = "/api/:tenant/fields"
  to = "/.netlify/functions/fields?tenant=:tenant"
  status = 200
  force = true
[[redirects]]
  from = "/api/:tenant/enquiries"
  to = "/.netlify/functions/enquiries?tenant=:tenant"
  status = 200
  force = true
[[redirects]]
  from = "/api/:tenant/settings"
  to = "/.netlify/functions/settings?tenant=:tenant"
  status = 200
  force = true
[[redirects]]
  from = "/api/:tenant/survey"
  to = "/.netlify/functions/survey?tenant=:tenant"
